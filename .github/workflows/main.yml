name: Android APK Cloud Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Yeh step aapki saari files ko sahi Android folder structure me automatic arrange kar dega
      - name: Structure Project Files
        run: |
          mkdir -p app/src/main/java/com/weather/app
          mkdir -p app/src/main
          
          # Files ko sahi jagah move karna
          [ -f MainActivity.kt ] && mv MainActivity.kt app/src/main/java/com/weather/app/
          [ -f WeatherApiService.kt ] && mv WeatherApiService.kt app/src/main/java/com/weather/app/
          [ -f WeatherModel.kt ] && mv WeatherModel.kt app/src/main/java/com/weather/app/
          [ -f WeatherScreen.kt ] && mv WeatherScreen.kt app/src/main/java/com/weather/app/
          [ -f WeatherViewModel.kt ] && mv WeatherViewModel.kt app/src/main/java/com/weather/app/
          [ -f AndroidManifest.xml ] && mv AndroidManifest.xml app/src/main/
          
          # Basic settings files banana jo Android build ke liye zaroori hain
          echo "include ':app'" > settings.gradle
          
          echo "plugins { id 'com.android.application' version '8.1.0' apply false; id 'org.jetbrains.kotlin.android' version '1.8.10' apply false }" > build.gradle
          
          echo -e "plugins {\n    id 'com.android.application'\n    id 'org.jetbrains.kotlin.android'\n}\n\nandroid {\n    namespace 'com.weather.app'\n    compileSdk 34\n    defaultConfig {\n        applicationId 'com.weather.app'\n        minSdk 24\n        targetSdk 34\n        versionCode 1\n        versionName '1.0'\n    }\n    buildFeatures {\n        compose true\n    }\n    composeOptions {\n        kotlinCompilerExtensionVersion '1.4.3'\n    }\n}\n\ndependencies {\n    implementation 'androidx.core:core-ktx:1.12.0'\n    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'\n    implementation 'androidx.activity:activity-compose:1.8.0'\n    implementation platform('androidx.compose:compose-bom:22023.08.00')\n    implementation 'androidx.compose.ui:ui'\n    implementation 'androidx.compose.ui:ui-graphics'\n    implementation 'androidx.compose.material3:material3'\n    implementation 'com.squareup.retrofit2:retrofit:2.9.0'\n    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'\n    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.6.2'\n}" > app/build.gradle

      - name: Setup Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.0
          chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: weather-app-apk
          path: app/build/outputs/apk/debug/app-debug.apk
